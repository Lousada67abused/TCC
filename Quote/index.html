<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <script src="js/tema.js?v=2"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/index.css">
    
    <title>Quote</title>
    <link rel="stylesheet" href="css/interacoes.css">
    <link rel="stylesheet" href="css/tema.css?v=2" data-estilo-tema>
</head>
<body>
    <main>
        <section id="Inicio">
            <div id="cardHome">
                <img src="img/logoAzulEscuro.svg" alt="Logotipo do Quote">

                <div class="adorno">
                    <div class="tracado"></div><img src="img/iconeLivro.svg" alt="Ícone Livro" class="iconeLivro"><div class="tracado"></div>
                </div>
              
                <div class="txtIntroducao">
                    <h1>Sua próxima história começa por aqui</h1>
                    <h2>Descubra, avalie e compartilhe os melhores livros</h2>
                </div>
        
                <nav>
                    <a id="btnEntrar" href="html/login.html">entrar</a>
                    <a id="btnCadastrar" href="html/cadastro.html">cadastrar</a>
        
                    <div class="adorno">
                        <div class="tracado"></div><span>ou continue com</span><div class="tracado"></div>
                    </div>   
        
                    <div class="botoesSocial">
                        <button id="btnGoogle"><img src="img/iconeGoogle.svg" alt="Botão para cadastrar usando conta do Google"></button>
                        <button id="btnApple"><img src="img/iconeApple.svg" alt="Botão para cadastrar usando conta da Apple"></button>
                        <button id="btnTwitter"><img src="img/iconeTwitter.svg" alt="Botão para cadastrar usando conta do Tinder"></button>
                        <button id="btnFacebook"><img src="img/iconeFacebook.svg" alt="Botão para cadastrar usando conta do Facebook"></button>
                    </div>
                </nav>
            </div>
        </section>
    </main>

</html>
