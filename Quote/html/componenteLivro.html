<article className="cardLivro">
    <img src={imagemUrl} alt={titulo} className="capaLivro"/>

    <h3 className="nomeLivro">{titulo}</h3>
    <p className="nomeAutor">{autor}</p>

    <div className="avaliacao" aria-label={`Avaliação: ${nota} de 5 estrelas`}>
      {estrelas.map((preenchida, index) => (
        <span key={index} aria-hidden="true" style={{ fontSize: '300%', color: preenchida ? 'yellow' : 'gray'}}
        >
          ★
        </span>
      ))}
    </div>
  </article>
)
