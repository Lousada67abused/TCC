<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote - Últimas leituras</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/ultimasLeituras.css">
</head>
<body>

    <header class="cabecalhoPrincipal">
        <figure class="logotipoContainer">
            <a href="homepage.html">
                <img src="../img/logoBranco.svg" alt="Logotipo do Quote">
            </a>
        </figure>
    </header>

    <div class="headerMobileBusca">
        <a href="javascript:history.back()" class="btnVoltarHeaderMobile">
            <span class="material-symbols-outlined">arrow_back</span>
        </a>
        <div class="barraPesquisaMobileHeader">
            <input type="text" placeholder="Pesquise por autores, livros...">
            <span class="material-symbols-outlined">search</span>
        </div>
    </div>

    <main class="conteudoPrincipalResultados">
        
        <div class="topoResultadoDesktop">
            <a href="javascript:history.back()" class="btnVoltarDesktop">
                <span class="material-symbols-outlined">arrow_back</span>
            </a>
            <div class="barraPesquisaInterna">
                <input type="text" placeholder="Pesquise por autores, livros...">
                <span class="material-symbols-outlined">search</span>
            </div>
        </div>

        <h1 class="tituloResultados">Busque os livros que você já leu</h1>

        <div class="gridResultadosLivros"></div>
        <span class="mensagemErro escondido" role="alert"></span>

        <div class="containerPaginacao">
            <button type="button" class="btnProximo">proximo<span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span></button>
        </div>

    </main>

    <nav class="navegacaoMobile">
        <a href="home.html" class="itemNavegacao">
            <span class="material-symbols-outlined">home</span>
        </a>
        <a href="ranking.html" class="itemNavegacao">
            <span class="material-symbols-outlined">trophy</span>
        </a>
        <a href="pesquisa.html" class="itemNavegacao ativo">
            <span class="material-symbols-outlined">search</span>
        </a>
        <a href="#" class="itemNavegacao">
            <span class="material-symbols-outlined">menu_book</span>
        </a>
        <a href="#" class="itemNavegacao">
            <span class="material-symbols-outlined">person</span>
        </a>
    </nav>

    <script src="../js/cadastroCompartilhado.js"></script>
    <script src="../js/ultimasLeituras.js"></script>
</body>
</html>
