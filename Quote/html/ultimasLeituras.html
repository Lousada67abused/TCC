<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote — Últimas leituras</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/ultimasLeituras.css">
    <script src="../js/ultimasLeituras.js" defer></script>
</head>
<body>
    <header class="cabecalhoPrincipal">
        <figure class="logotipoContainer">
            <a href="../index.html" aria-label="Página inicial do Quote">
                <img src="../img/logoBranco.svg" alt="Quote">
            </a>
        </figure>
    </header>
    <main class="conteudoPrincipalResultados">
        <p>Personalize sua biblioteca</p>
        <h1>Quais livros você já leu?</h1>
        <p>Busque pelo título e selecione suas últimas leituras. Esta etapa é opcional.</p>
        <form id="formPesquisaLivros" class="barraPesquisaInterna" role="search">
            <label for="txtPesquisaLivros" class="rotuloPesquisa">Título do livro</label>
            <input id="txtPesquisaLivros" name="titulo" type="search" placeholder="Busque pelo título" autocomplete="off">
            <button type="submit" class="btnBuscarLivro" aria-label="Buscar livros">
                <span class="material-symbols-outlined" aria-hidden="true">search</span>
            </button>
        </form>
        <section aria-labelledby="tituloResultados">
            <h2 id="tituloResultados" class="tituloResultados" aria-live="polite">Busque um livro para começar</h2>
            <div id="listaLivros" class="gridResultadosLivros" aria-busy="false"></div>
        </section>
        <p id="mensagemLivros" class="mensagemErro" role="alert" hidden></p>
        <div class="containerPaginacao">
            <p id="contadorLivros" role="status">0 livros selecionados</p>
            <button id="btnProximo" type="button" class="btnProximo">Pular esta etapa</button>
        </div>
        <noscript>Ative o JavaScript para selecionar suas últimas leituras.</noscript>
    </main>
</body>
</html>
