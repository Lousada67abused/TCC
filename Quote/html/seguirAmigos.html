<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/seguirAmigos.css">
    <title>Quote - Seguir amigos</title>
</head>
<body class="paginaSeguirAmigos">
    <header class="cabecalhoPrincipal">
        <figure class="logotipoContainer"><a href="homepage.html"><img src="../img/logoBranco.svg" alt="Logotipo do Quote"></a></figure>
    </header>
    <main class="conteudoPrincipal">
        <div class="containerTopoDesktop">
            <a href="homepage.html" class="botaoVoltarDesktop" aria-label="Pular esta etapa"><span class="material-symbols-outlined" aria-hidden="true">arrow_back</span></a>
            <form class="barraPesquisaDesktop" role="search">
                <input type="search" id="txtPesquisaAmigos" placeholder="Encontre seus amigos" aria-label="Pesquisar amigos pelo nome">
                <button type="submit" id="btnPesquisaAmigos" aria-label="Pesquisar amigos"><span class="material-symbols-outlined" aria-hidden="true">search</span></button>
            </form>
            <a href="homepage.html" class="botaoFinalizar">finalizar <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span></a>
        </div>
        <h1 class="tituloResultadoBusca tituloAmigos">Encontre seus amigos</h1>
        <p id="estadoAmigos" role="status">Pesquise pelo nome para encontrar outros leitores.</p>
        <p class="mensagemErro escondido" role="alert"></p>
        <section class="listaUsuarios listaLeitores" aria-label="Leitores encontrados"></section>
    </main>
    <script src="../js/seguirAmigos.js"></script>
</body>
</html>
