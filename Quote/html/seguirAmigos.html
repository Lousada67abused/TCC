<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/leitores.css">
    <link rel="stylesheet" href="../css/seguirAmigos.css">

    <title>Quote - Seguir amigos</title>
</head>
<body>
    <header>
        <figure>
            <a>
                <img src="../img/logoBranco.svg" alt="Logotipo do quote">
            </a>
        </figure>
    </header>

    <main>
        <div class="topoAmigos">
            <a href="homepage.html" class="btnVoltar" aria-label="Pular esta etapa">
                <span class="material-symbols-outlined">arrow_back</span>
            </a>
            <div class="barraPesquisa">
                <input type="text" id="txtPesquisaAmigos" placeholder="Encontre seus amigos">
                <span class="material-symbols-outlined" id="btnPesquisaAmigos">search</span>
            </div>
        </div>

        <h1 class="tituloAmigos">Pesquise pelo nome dos seus amigos para seguir</h1>

        <ul class="listaLeitores"></ul>

        <span class="mensagemErro escondido"></span>

        <a href="homepage.html" class="btnFinalizar">
            finalizar
            <span class="material-symbols-outlined">arrow_forward</span>
        </a>
    </main>

    <script src="../js/leitores.js"></script>
    <script src="../js/seguirAmigos.js"></script>
</body>
</html>
