<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script src="../js/tema.js?v=2"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/cadastro.css">
        <link rel="stylesheet" href="../css/etapasCadastro.css">
    <title>Quote</title>
    <link rel="stylesheet" href="../css/interacoes.css">
    <link rel="stylesheet" href="../css/tema.css?v=2" data-estilo-tema>
</head>
<body class="paginaCadastro">
    <header>
        <figure>
            <a href="../index.html" aria-label="Página inicial">
                <img src="../img/logoBranco.svg" alt="Logotipo do quote">
            </a>
        </figure>
    </header>
    
    <main class="containerCadastro">
        <form method="post" class="formularioCadastro" novalidate>
            <div class="cabecalhoCadastro">
                <a href="../index.html" class="btnVoltar" aria-label="Voltar para a página anterior">
                    <span class="material-symbols-outlined line_start_arrow_notch" id="line_start_arrow_notch">line_start_arrow_notch</span>
                </a>
                <h1 tabindex="-1">Criar conta</h1>
            </div>
            
            <div class="campoCadastro">
                <label for="txtNome">Nome de usuário</label>
                <input type="text" id="txtNome" name="nome" placeholder="Digite seu nome de usuário">
            </div>

            <div class="campoCadastro">
                <label for="txtDataNascimento">Data de nascimento</label>
                <input type="date" id="txtDataNascimento" name="dataNascimento" placeholder="Data">
            </div>

             <div class="campoCadastro">
                <label for="txtBiografia">Biografia (Opcional)</label>
                <input type="text" id="txtBiografia" name="biografia" placeholder="Fale um pouco sobre você">
            </div>

            <div class="campoCadastro">
                <label for="txtEmail">Email</label>
                <input type="email" id="txtEmail" name="email" placeholder="Digite seu email">
            </div>

            <div class="campoCadastro">
                <label for="txtSenha1">Senha</label>
                <div class="inputSenhaContainer">
                    <input type="password" id="txtSenha1" name="senha1" placeholder="Mínimo de 6 caracteres">
                    <button type="button" class="btnMostrarSenha" aria-label="Mostrar ou ocultar senha">
                        <span class="material-symbols-outlined" aria-hidden="true">visibility_off</span>
                    </button>
                </div>
            </div>

            <div class="campoCadastro">
                <label for="txtSenha2">Confirme sua senha</label>
                <div class="inputSenhaContainer">
                    <input type="password" id="txtSenha2" name="senha2" placeholder="Digite sua senha novamente">
                    <button type="button" class="btnMostrarSenha" aria-label="Mostrar ou ocultar senha">
                        <span class="material-symbols-outlined" aria-hidden="true">visibility_off</span>
                    </button>
                </div>
            </div>
            
            <span class="mensagemErro escondido" role="status"></span>

            <div class="elementoDecorativo">
                <div class="linha"></div>
                <p>ou continue com</p>
                <div class="linha"></div>
            </div>
           
            <div class="opcoesEntrar">
                <ul class="botoesSociais" aria-label="Opções para continuar com redes sociais">
                    <li>
                        <button type="button" class="botaoSocial" aria-label="Entrar com Google">
                            <img src="../img/iconeGoogle.svg" alt="" aria-hidden="true">
                        </button>
                    </li>
                    <li>
                        <button type="button" class="botaoSocial" aria-label="Entrar com Apple">
                            <img src="../img/iconeApple.svg" alt="" aria-hidden="true">
                        </button>
                    </li>
                    <li>
                        <button type="button" class="botaoSocial" aria-label="Entrar com Twitter">
                            <img src="../img/iconeTwitter.svg" alt="" aria-hidden="true">
                        </button>
                    </li>
                    <li>
                        <button type="button" class="botaoSocial" aria-label="Entrar com Facebook">
                            <img src="../img/iconeFacebook.svg" alt="" aria-hidden="true">
                        </button>
                    </li>
                </ul>

                <div class="temConta">
                    <p>Já tem conta?</p>
                    <a href="login.html" class="btnIrLogin">Entrar</a>
                </div>

            </div>
         
            <button type="submit" class="btnProximo">
                próximo
                <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span>
            </button>
        </form>          
    </main>
    <template id="templateGeneros">
        <section id="cadastroPasso2" class="cadastroEtapa" aria-labelledby="tituloGeneros">
            <div class="textoGuia">
                <div class="cabecalhoEtapa">
                    <button type="button" class="btnVoltar voltarConta" aria-label="Voltar para seus dados"><span class="material-symbols-outlined">arrow_back</span></button>
                    <h1 id="tituloGeneros" tabindex="-1">Selecione seus gêneros favoritos</h1>
                </div>
                <p>Encontre sua próxima leitura entre vários gêneros literários.</p>
            </div>
            <div class="selecaoGenero" aria-label="Gêneros disponíveis"></div>
            <p class="mensagemErro escondido" role="status"></p>
            <div class="containerPaginacao">
                <button type="button" id="btnIrPasso3" class="btnProximo">próximo <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span></button>
            </div>
        </section>
    </template>
    <template id="templateLeituras">
        <section id="cadastroPasso3" class="cadastroEtapa" aria-labelledby="tituloLeituras">
            <div class="topoResultadoDesktop">
                <button type="button" class="btnVoltar voltarGeneros" aria-label="Voltar para os gêneros"><span class="material-symbols-outlined">arrow_back</span></button>
                <form class="barraPesquisaInterna" role="search">
                    <input type="search" aria-label="Pesquisar suas últimas leituras" placeholder="Busque por suas últimas leituras">
                    <button type="submit" aria-label="Pesquisar livros"><span class="material-symbols-outlined">search</span></button>
                </form>
                <button type="button" id="btnIrPasso4" class="btnProximo">próximo <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span></button>
            </div>
            <h1 id="tituloLeituras" class="tituloResultados" tabindex="-1">Busque os livros que você já leu</h1>
            <div class="listaLivros gridResultadosLivros"></div>
            <p class="mensagemErro escondido" role="status"></p>
            <div class="containerPaginacao">
                <p class="quantidadeSelecionada" role="status">Nenhum livro selecionado</p>
            </div>
        </section>
    </template>
    <script src="../js/cadastro.js"></script>
</body>
</html>
