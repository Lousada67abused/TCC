<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/index.css">
    
    
    <title>Página de login/cadastro</title>
</head>
<body>
    <main>
        <img src="imagens/logoAzulEscuro.png" alt="Quote">

        <div class="adorno">
            <div class="tracado"></div><img src="imagens/iconeLivro.png" alt="Ícone Livro" class="iconeLivro"><div class="tracado"></div>
        </div>
      
        <div class="txtIntroducao">
            <h1>Sua próxima história começa por aqui</h1>
            <h2>Descubra, avalie e compartilhe os melhores livros</h2>
        </div>

        <nav>
            <a href="login/login.html" class="btnEntrar">entrar</a>
            <a href="cadastro/cadastro.html" class="btnCadastrar">cadastrar</a>

            <div class="adorno">
                <div class="tracado"></div><span>ou continue com</span><div class="tracado"></div>
            </div>   

            <div class="opcoesEntrar">
                <button id="btnGoogle"><img src="imagens/iconeGoogle.png" alt="Botão para cadastrar usando conta do Google"></button>
                <button id="btnApple"><img src="imagens/iconeApple.png" alt="Botão para cadastrar usando conta da Apple"></button>
                <button id="btnTwitter"><img src="imagens/iconeTwitter.png" alt="Botão para cadastrar usando conta do Tinder"></button>
                <button id="btnFacebook"><img src="imagens/iconeFacebook.png" alt="Botão para cadastrar usando conta do Facebook"></button>
            </div>
        </nav>
    </main>
</body>
</html>
