<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/cadastro.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <title>Cadastro</title>
</head>
<body>
    <header>
        <img src="img/logo.svg" alt="Quote" class="quote">
    </header>
    <main>
        <form action="" method="post">
           
            <div>
                <a href="index.html"><img src="imagens/voltarCadastro.png" alt="Botão voltar" class="btnVoltar"></a><h1>Criar Conta</h1>
                <h2>Junte-se ao quote e compartilhe sua jornada literária.</h2>
            </div>

            <div>
                <label for="txtNome">Nome de usuário</label>
                <input type="text" name="txtNome" id="txtNome" placeholder="Digite seu nome de usuário">
            </div>
            
            <div>
                <label for="txtNascimento">Data de nascimento</label>
                <input type="date" name="txtNascimento" id="txtNascimento">
            </div>
            
            <div>
                <label for="txtBiografia">Biografia (opcional)</label>
                <input type="text" name="txtBiografia" id="txtBiografia">
            </div>
            
            <div>
                <label for="txtEmail">Email</label>
                <input type="email" name="email" id="txtEmail" placeholder="Digite seu email">
            </div>
        
            <div>
                <label for="txtSenha">Senha</label>
                <input type="text" name="senha" id="txtSenha" placeholder="Digite sua senha">
            </div>

           <div class="adorno">
                <div class="tracado"></div><span>ou continue com</span><div class="tracado"></div>
            </div> 
           
           <div class="opcoesEntrar">
            <button id="btnGoogle"><img src="imagens/iconeGoogle.png" alt="Botão para cadastrar usando conta do Google"></button>
            <button id="btnApple"><img src="imagens/iconeApple.png" alt="Botão para cadastrar usando conta da Apple"></button>
            <button id="btnTwitter"><img src="imagens/iconeTwitter.png" alt="Botão para cadastrar usando conta do Tinder"></button>
            <button id="btnFacebook"><img src="imagens/iconeFacebook.png" alt="Botão para cadastrar usando conta do Facebook"></button>

            <div><span>Já tem conta?</span><a href="../index.html">Entrar</a></div>
        </div>
        </form>

        <button class="btnConfirmar" type="submit">Próximo 
            <span class="material-symbols-outlined">
            line_end_arrow_notch
            </span>
        </button>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
