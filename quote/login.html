<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/login.css">


    <title>Login</title>
</head>
<body>
    <main>
        <a href="index.html"><img src="imagens/voltarLogin.png" alt="Botão voltar" class="btnVoltar"></a>
        <img src="img/logoAzulEscuro.svg" alt="Logotipo do Quote">

        <div class="adorno">
            <div class="tracado"></div><img src="img/iconeLivro.svg" alt="Icone Livro" class="iconeLivro"><div class="tracado"></div>
        </div>
      
        <div class="txtIntroducao">
            <h1>Bom te ver novamente</h1>
            <h2>Continue descubrindo, avaliando e compartilhando os melhores livros</h2>
        </div>

        <form action="" method="post">
            <label for="txtEmail">Email</label>
            <input type="email" name="email" id="txtEmail" placeholder="Digite seu email">

             <label for="txtSenha">Senha</label>
            <input type="text" name="senha" id="txtSenha" placeholder="Digite sua senha">

            <button id="btnEntrar" type="submit">entrar</button>
        </form>

        <nav>
            <div class="adorno">
                <div class="tracado"></div><span>ou continue com</span><div class="tracado"></div>
            </div>   

            <div class="opcoesEntrar">
                <button id="btnGoogle"><img src="img/iconeGoogle.svg" alt="Botão para cadastrar usando conta do Google"></button>
                <button id="btnApple"><img src="img/iconeApple.svg" alt="Botão para cadastrar usando conta da Apple"></button>
                <button id="btnTwitter"><img src="img/iconeTwitter.svg" alt="Botão para cadastrar usando conta do Tinder"></button>
                <button id="btnFacebook"><img src="img/iconeFacebook.svg" alt="Botão para cadastrar usando conta do Facebook"></button>
            </div>
        </nav>
    </main>
</body>
</html>
