<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/livro.css">
    
    <title>Página do livro</title>
    
</head>
<body>

    <header>
        <figure>
            <img src="img/logoBranco.svg" alt="Logotipo do quote">
        </figure>
        <div class="barraPesquisa">
            <input type="text" placeholder="Pesquise por autores, livros, gêneros e pessoas.">
            <span class="material-symbols-outlined">search</span>
        </div>
        <img src="img/avatar.png" alt="Foto de perfil do usuario">
    </header>

    <main>
        <section>
            <figure>
                <img src="img/capa5.jpg" alt="capa do livro Castro.">
            </figure>
            <nav>
                <h1>Jogos Gulosos: A revolta de Castro</h1>
                <p>Filippo Bento</p>
                <div class="areaEstrelasLivro">
                    <img src="img/estrela-cheia.svg" alt="Estrela cheia">
                    <img src="img/estrela-cheia.svg" alt="Estrela cheia">
                    <img src="img/estrela-vazia.svg" alt="Estrela vazia">
                    <img src="img/estrela-vazia.svg" alt="Estrela vazia">
                    <img src="img/estrela-vazia.svg" alt="Estrela vazia">
                </div>
                
            </nav>
        </section>
    </main>

</html>
