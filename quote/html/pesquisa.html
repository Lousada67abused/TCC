<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/pesquisa.css">
    <title>Página de pesquisa</title>
</head>
<body>

    <header class="cabecalhoPrincipal">
        <figure class="logotipoContainer">
            <a href="homepage.html">
                <img src="../img/logoBranco.svg" alt="Logotipo do quote">
            </a>
        </figure>

        <div class="barraPesquisa">
            <input type="text" placeholder="Pesquise por autores, livros, gêneros e pessoas.">
            <span class="material-symbols-outlined">search</span>
        </div>

        <div class="avatarPerfil">
            <img src="../img/usuario.jpg" alt="Foto de perfil do usuario">
        </div>
    </header>

    <div class="containerPesquisaMobile">

        <div class="barraPesquisaMobile">
            <input type="text" placeholder="Pesquise por autores, livros, gêneros e pessoas.">
            <span class="material-symbols-outlined">search</span>
        </div>
    </div>

    <main class="conteudoPrincipal">
        <div class="textoGuia">
            <h1>Navegue por todos os tipos de gêneros</h1>
            <p>Encontre sua próxima leitura entre vários gêneros literários</p>
        </div>

        <section class="selecaoGenero">
            <button class="botaoGenero"><img src="../img/generoRomance.png" alt="Selecionar livros com gênero de romance"></button>
            <button class="botaoGenero"><img src="../img/generoSuspense.png" alt="Selecionar livros com gênero de suspense"></button>
            <button class="botaoGenero"><img src="../img/generoFantasia.png" alt="Selecionar livros com gênero de fantasia"></button>
            <button class="botaoGenero"><img src="../img/generoBiografia.png" alt="Selecionar livros com gênero de biografia"></button>
            <button class="botaoGenero"><img src="../img/generoFiccaoHistorica.png" alt="Selecionar livros com gênero de ficção histórica"></button>
            <button class="botaoGenero"><img src="../img/generoFiccaoCientifica.png" alt="Selecionar livros com gênero de ficção científica"></button>
            <button class="botaoGenero"><img src="../img/generoPoesia.png" alt="Selecionar livros com gênero de poesia"></button>
            <button class="botaoGenero"><img src="../img/generoTerror.png" alt="Selecionar livros com gênero de terror"></button>
            <button class="botaoGenero"><img src="../img/generoAventura.png" alt="Selecionar livros com gênero de aventura"></button>
            <button class="botaoGenero"><img src="../img/generoAutoAjuda.png" alt="Selecionar livros com gênero de auto-ajuda"></button>
            <button class="botaoGenero"><img src="../img/generoFilosofia.png" alt="Selecionar livros com gênero de filosofia"></button>
            <button class="botaoGenero"><img src="../img/generoDrama.png" alt="Selecionar livros com gênero de drama"></button>
        </section>
    <p class="mensagemErro escondido" role="status"></p></main>

    <nav class="navegacaoMobile">
        <a href="homepage.html" class="itemNavegacao"><span class="material-symbols-outlined">home</span></a>
        <a href="ranking.html" class="itemNavegacao"><span class="material-symbols-outlined">trophy</span></a>
        <a href="pesquisa.html" class="itemNavegacao ativo"><span class="material-symbols-outlined">search</span></a>
        <a href="bibliotecaPessoal.html" class="itemNavegacao"><span class="material-symbols-outlined">auto_stories</span></a>
        <a href="perfil.html" class="itemNavegacao"><span class="material-symbols-outlined">person</span></a>
    </nav>

<script src="../js/interface.js"></script></body>
</html>
