<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/ranking.css">
    <title>Ranking de livros - Quote</title>
</head>
<body class="paginaRanking">
    <header class="cabecalhoPrincipal">
        <figure class="logotipoContainer">
            <a href="homepage.html"><img src="../img/logoBranco.svg" alt="Logotipo do Quote"></a>
        </figure>
        <form class="barraPesquisa" action="busca.html" method="get" role="search">
            <label class="rotuloAcessivel" for="txtPesquisaHeader">Pesquisar livros, gêneros, autores ou leitores</label>
            <input id="txtPesquisaHeader" name="termo" type="search" placeholder="Encontre sua próxima leitura" maxlength="100" required>
            <input name="filtro" type="hidden" value="geral" data-filtro-header>
            <button type="submit" aria-label="Pesquisar"><span class="material-symbols-outlined" aria-hidden="true">search</span></button>
        </form>
        <div class="acoesHeaderDesktop">
            <div class="perfilMenuContainer">
                <button type="button" class="botaoAvatarPerfil" aria-label="Abrir menu do perfil" aria-expanded="false" aria-controls="menuPerfilRanking">
                    <img id="avatar" class="avatarHeader" src="../img/avatar.jpg" alt="Foto de perfil do usuário">
                </button>
                <div id="menuPerfilRanking" class="menuDropdownPerfil">
                    <div class="cabecalhoDropdown">
                        <img id="avatarMenu" class="avatarHeader" src="../img/avatar.jpg" alt="Foto de perfil do usuário">
                        <div><strong id="nomeUsuarioHeader">Seu perfil</strong><small id="emailUsuarioHeader"></small></div>
                    </div>
                    <ul class="listaMenuDropdown">
                        <li><a href="perfil.html"><span class="material-symbols-outlined" aria-hidden="true">person</span>Perfil</a></li>
                        <li><a href="biblioteca.html"><span class="material-symbols-outlined" aria-hidden="true">collections_bookmark</span>Biblioteca</a></li>
                        <li><a href="login.html"><span class="material-symbols-outlined" aria-hidden="true">login</span>Entrar</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </header>

    <main class="conteudoRanking">
        <div class="cabecalhoRanking">
            <div>
                <h1 id="tituloRanking">Ranking dos livros mais bem avaliados</h1>
                <p id="descricaoRanking">Baseado nas avaliações da comunidade</p>
            </div>
        </div>
        <div class="gradeRanking">
            <aside class="filtrosRanking" aria-labelledby="tituloFiltroGeneros">
                <h2 id="tituloFiltroGeneros">Mostrar resultados de</h2>
                <div class="seletorGeneroMobile">
                    <label for="generoRanking">Escolha um gênero</label>
                    <select id="generoRanking" name="genero" disabled></select>
                </div>
                <p id="estadoGeneros" class="estadoRanking" role="status">Carregando gêneros...</p>
                <button id="tentarGeneros" class="tentarRanking" type="button" hidden>Tentar novamente</button>
                <nav id="filtrosGeneros" class="listaFiltrosGeneros" aria-label="Filtrar ranking por gênero"></nav>
            </aside>
            <section class="resultadosRanking" aria-labelledby="tituloRanking">
                <p id="estadoRanking" class="estadoRanking" role="status"></p>
                <button id="tentarRanking" class="tentarRanking" type="button" hidden>Tentar novamente</button>
                <ol id="podioRanking" class="podioRanking" role="list" aria-label="Três primeiros colocados" aria-busy="false"></ol>
                <ol id="listaRanking" class="listaRanking" start="4" role="list" aria-label="Livros do quarto ao décimo lugar" aria-busy="false"></ol>
            </section>
        </div>
    </main>

    <nav class="navegacaoMobile" aria-label="Navegação principal">
        <a href="homepage.html" class="itemNavegacao" aria-label="Início"><span class="material-symbols-outlined" aria-hidden="true">home</span></a>
        <a href="ranking.html" class="itemNavegacao ativo" aria-label="Ranking" aria-current="page"><span class="material-symbols-outlined" aria-hidden="true">emoji_events</span></a>
        <a href="pesquisa.html" class="itemNavegacao" aria-label="Pesquisar"><span class="material-symbols-outlined" aria-hidden="true">search</span></a>
        <a href="biblioteca.html" class="itemNavegacao" aria-label="Biblioteca"><span class="material-symbols-outlined" aria-hidden="true">collections_bookmark</span></a>
        <a href="perfil.html" class="itemNavegacao" aria-label="Perfil"><span class="material-symbols-outlined" aria-hidden="true">person</span></a>
    </nav>
    <script src="../js/header.js"></script>
    <script src="../js/menuPerfil.js"></script>
    <script src="../js/ranking.js"></script>
    <script src="../js/pesquisa.js"></script>
    <script src="../js/entradaPesquisa.js"></script>
</body>
</html>
