<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/busca.css">
    <link rel="stylesheet" href="../css/leitores.css">
    <title>Resultados da pesquisa - Quote</title>
</head>
<body class="paginaBusca">
    <header class="cabecalhoPrincipal">
        <figure class="logotipoContainer">
            <a href="homepage.html"><img src="../img/logoBranco.svg" alt="Logotipo do Quote"></a>
        </figure>
        <form class="barraPesquisa" action="busca.html" method="get" role="search">
            <label class="rotuloAcessivel" for="txtPesquisaHeader">Pesquisar livros, gêneros, autores ou leitores</label>
            <input id="txtPesquisaHeader" name="termo" type="search" placeholder="Encontre sua próxima leitura" maxlength="100" required>
            <input name="filtro" type="hidden" value="geral" data-filtro-header>
            <button type="submit" aria-label="Pesquisar"><span class="material-symbols-outlined" aria-hidden="true">search</span></button>
        </form>
        <div class="acoesHeaderDesktop">
            <div class="perfilMenuContainer">
                <img id="avatar" class="avatarHeader" src="../img/avatar.jpg" alt="Foto de perfil do usuário" tabindex="0">
                <div class="menuDropdownPerfil">
                    <div class="cabecalhoDropdown">
                        <img id="avatarMenu" class="avatarHeader" src="../img/avatar.jpg" alt="Foto de perfil do usuário">
                        <div><strong id="nomeUsuarioHeader">Seu perfil</strong><small id="emailUsuarioHeader"></small></div>
                    </div>
                    <ul class="listaMenuDropdown">
                        <li><a href="perfil.html"><span class="material-symbols-outlined" aria-hidden="true">person</span>Perfil</a></li>
                        <li><a href="biblioteca.html"><span class="material-symbols-outlined" aria-hidden="true">collections_bookmark</span>Biblioteca</a></li>
                        <li><a href="login.html"><span class="material-symbols-outlined" aria-hidden="true">login</span>Entrar</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </header>
    <main class="conteudoBusca">
        <form class="pesquisaMobile" action="busca.html" method="get" role="search">
            <label class="rotuloAcessivel" for="txtPesquisaBusca">Pesquisar</label>
            <input id="txtPesquisaBusca" name="termo" type="search" placeholder="Busque por livros" maxlength="100" required>
            <input id="filtroPesquisaMobile" name="filtro" type="hidden" value="geral">
            <button id="btnPesquisaBusca" type="submit" aria-label="Pesquisar"><span class="material-symbols-outlined" aria-hidden="true">search</span></button>
        </form>
        <h1 class="tituloBusca">Resultados da pesquisa</h1>
        <nav class="filtros" aria-label="Filtrar resultados">
            <button type="button" data-filtro="geral" class="ativo" aria-pressed="true">geral</button>
            <button type="button" data-filtro="livros" aria-pressed="false">livros</button>
            <button type="button" data-filtro="generos" aria-pressed="false">gêneros</button>
            <button type="button" data-filtro="autores" aria-pressed="false">autores</button>
            <button type="button" data-filtro="leitores" aria-pressed="false">leitores</button>
        </nav>
        <div class="estadoPesquisa">
            <p id="estadoBusca" role="status"></p>
            <button id="tentarBusca" type="button" hidden>Tentar novamente</button>
        </div>
        <section class="resultadoLivros" aria-labelledby="subtituloLivros" hidden>
            <h2 id="subtituloLivros" class="subtituloBusca">Livros</h2>
            <div class="areaLivros"></div>
        </section>
        <section class="resultadoLeitores" aria-labelledby="subtituloLeitores" hidden>
            <h2 id="subtituloLeitores" class="subtituloBusca">Leitores</h2>
            <ul class="listaLeitores"></ul>
        </section>
    </main>
    <nav class="navegacaoMobile" aria-label="Navegação principal">
        <a href="homepage.html" class="itemNavegacao" aria-label="Início"><span class="material-symbols-outlined" aria-hidden="true">home</span></a>
        <a href="ranking.html" class="itemNavegacao" aria-label="Ranking"><span class="material-symbols-outlined" aria-hidden="true">emoji_events</span></a>
        <a href="pesquisa.html" class="itemNavegacao ativo" aria-label="Pesquisar" aria-current="page"><span class="material-symbols-outlined" aria-hidden="true">search</span></a>
        <a href="biblioteca.html" class="itemNavegacao" aria-label="Biblioteca"><span class="material-symbols-outlined" aria-hidden="true">collections_bookmark</span></a>
        <a href="perfil.html" class="itemNavegacao" aria-label="Perfil"><span class="material-symbols-outlined" aria-hidden="true">person</span></a>
    </nav>
    <script src="../js/header.js"></script>
    <script src="../js/menuPerfil.js"></script>
    <script src="../js/leitores.js"></script>
    <script src="../js/busca.js"></script>
</body>
</html>
