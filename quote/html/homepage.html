<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/homepage.css">
    <title>Página Principal - Quote</title>
</head>
<body>

    <header class="cabecalhoPrincipal">
        <figure class="logotipoContainer">
            <a href="homepage.html">
                <img src="../img/logoBranco.svg" alt="Logotipo do quote">
            </a>
        </figure>
        
        <form class="barraPesquisa" action="busca.html" method="get" role="search">
            <input type="search" name="termo" maxlength="100" required aria-label="Pesquisar livros e leitores" placeholder="Encontre sua próxima leitura">
            <input type="hidden" name="filtro" value="geral">
            <button type="submit" aria-label="Pesquisar"><span class="material-symbols-outlined" aria-hidden="true">search</span></button>
        </form>

        <div class="acoesHeaderDesktop">
            <a href="ranking.html" class="botaoRanking">
                <span class="material-symbols-outlined">emoji_events</span>
                Ranking
            </a>

            <div class="perfilMenuContainer">
                <img id="avatar" class="avatarHeader" alt="Foto de perfil do usuario">
                
                
                <div class="menuDropdownPerfil">
                    <div class="cabecalhoDropdown">
                        <img id="avatarMenu" class="avatarHeader" alt="Foto de perfil do usuário">
                        <div>
                            <strong id="nomeUsuarioHeader">Seu perfil</strong>
                            <small id="emailUsuarioHeader"></small>
                        </div>
                    </div>
                    <ul class="listaMenuDropdown">
                        <li><a href="perfil.html"><span class="material-symbols-outlined">person</span>Perfil</a></li>
                        <li><a href="estante.html"><span class="material-symbols-outlined">collections_bookmark</span>Estante</a></li>
                        <li><a href="atividade.html"><span class="material-symbols-outlined">format_list_bulleted</span>Atividade</a></li>
                        <li><a href="resenhas.html"><span class="material-symbols-outlined">rate_review</span>Resenhas</a></li>
                        <li><a href="metas.html"><span class="material-symbols-outlined">target</span>Metas</a></li>
                        <li class="divisorMenu"></li>
                        <li><a href="#"><span class="material-symbols-outlined">settings</span>Configurações</a></li>
                        <li><a href="#" class="itemSair"><span class="material-symbols-outlined">logout</span>Sair</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </header>

    <main class="conteudoPrincipal">

        
        <section class="secaoGridLivros" aria-labelledby="tituloRecomendacoes">
            <h2 id="tituloRecomendacoes" class="tituloSecao">Baseado no seu gosto</h2>
            <p id="statusLivros" class="mensagemEstado" role="status"></p>
            <div class="areaLivros"></div>

            <div id="paginacaoLivros" class="containerBotaoVerMais paginacaoLivros" hidden>
                <span id="intervaloLivros" class="intervaloLivros" role="status"></span>
                <button id="livrosAnteriores" class="botaoVerMais botaoSecundario" type="button" hidden>anteriores</button>
                <button id="verMaisLivros" class="botaoVerMais" type="button" hidden>atualizar</button>
            </div>
        </section>

        <section class="secaoAmigos" aria-labelledby="tituloAmigos">
            <h2 id="tituloAmigos" class="tituloSecao">Amigos</h2>
            <p id="statusFeed" class="mensagemEstado" role="status"></p>
            <div class="listaResenhasAmigos"></div>

            <div class="containerBotaoVerMais">
                <button id="verMaisFeed" class="botaoVerMais" type="button" hidden>ver mais</button>
            </div>
        </section>

    </main>

    <nav class="navegacaoMobile">
        <a href="homepage.html" class="itemNavegacao ativo" aria-label="Início" aria-current="page"><span class="material-symbols-outlined" aria-hidden="true">home</span></a>
        <a href="ranking.html" class="itemNavegacao" aria-label="Ranking"><span class="material-symbols-outlined" aria-hidden="true">emoji_events</span></a>
        <a href="pesquisa.html" class="itemNavegacao" aria-label="Pesquisar"><span class="material-symbols-outlined" aria-hidden="true">search</span></a>
        <a href="biblioteca.html" class="itemNavegacao" aria-label="Biblioteca"><span class="material-symbols-outlined" aria-hidden="true">collections_bookmark</span></a>
        <a href="perfil.html" class="itemNavegacao" aria-label="Perfil"><span class="material-symbols-outlined" aria-hidden="true">person</span></a>
    </nav>

    <script src="../js/homepage.js"></script>
    <script src="../js/feed.js"></script>
</body>
</html>
